# The URL points to your local machine (localhost), the port (5432), and your DB name
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_db

# Use 'postgres' as the default username
spring.datasource.username=postgres

# Use the password you set during the installation wizard
spring.datasource.password=rishi

# Hibernate settings to automatically create tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect